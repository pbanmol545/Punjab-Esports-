name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E -n 's/.*version "([0-9]+).*/\1/p')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect active Java major version from output:" >&2
            echo "$JAVA_VER_OUTPUT" >&2
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17." >&2
            exit 1
          fi

          echo "Java environment verification successful."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Setting up Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing file."
          else
            echo "debug.keystore not found. Generating temporary debug keystore using Java 17 keytool..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after generation attempt." >&2
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Built Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK" >&2
            echo "Discovered files in app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Built APK file is empty: $EXPECTED_APK" >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: Expected file does not have .apk extension: $EXPECTED_APK" >&2
              exit 1
              ;;
          esac

          echo "APK successfully verified at: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null) bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_BASE=$(basename "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g')
          RELEASE_ASSET_NAME="${REPO_BASE}-debug-build-${{ github.run_number }}.apk"

          ASSET_TEMP_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$ASSET_TEMP_DIR"

          DEST_PATH="$ASSET_TEMP_DIR/$RELEASE_ASSET_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $DEST_PATH" >&2
            exit 1
          fi

          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH does not exist or is empty." >&2
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE="${{ runner.temp }}/release_notes.md"
          cat << 'EOF' > "$NOTES_FILE"
          ### Debug APK Build

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Usage**: Intended for testing only
          - **Production Notice**: This is not a Play Store production release
          - **Signing**: Signed only with a temporary debug keystore

          Download the APK directly from the **Assets** section below.
          EOF

          echo "Creating release $TAG..."
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes-file "$NOTES_FILE"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting APK Download Result ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release creation succeeded."
            RELEASE_URL=$(gh release view "$TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG")
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Publish Succeeded!

          - **Release URL**: [$RELEASE_URL]($RELEASE_URL)
          - **Release Tag**: \`$TAG\`
          - **APK Asset**: \`$ASSET_NAME\`

          The debug APK is ready and can be downloaded directly from the **Assets** section of the [GitHub Release]($RELEASE_URL).

          > **Backup Artifact**: The standard Actions artifact named \`app-debug-apk\` is also available under the workflow run artifacts summary.
          EOF
          else
            echo "::warning::GitHub Release creation did not complete successfully or was skipped."
            echo "The APK was successfully built and uploaded to GitHub Actions artifacts."
            echo "Artifact Name: app-debug-apk"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Notice)

          The debug APK was **built successfully** and is available for download:
          - **Actions Artifact**: \`app-debug-apk\` (available under the workflow summary).
          - **Release Status**: Direct release publishing did not complete, but the built APK artifact remains fully preserved and downloadable.
          EOF
          fi
